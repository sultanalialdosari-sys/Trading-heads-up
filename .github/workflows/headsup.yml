# -*- coding: utf-8 -*-
"""SEC EDGAR: إفصاحات المخاطر وعدد الأسهم القائمة.

- مجاني، بلا مفتاح. يتطلب User-Agent فيه اسم وبريد (متغير البيئة SEC_USER_AGENT).
- الحد الرسمي 10 طلبات/ثانية — نلتزم بـ 8 كحد أقصى.
- لا نستخدم أي إفصاح قُبل بعد لحظة القرار (acceptanceDateTime <= now).
- Float غير متاح مجاناً بشكل موثوق، لذلك لا نقدّره: نعرض عدد الأسهم القائمة فقط.
"""
import json
import os
import time
from dataclasses import dataclass, field
from datetime import datetime, timedelta, timezone
from typing import Dict, List, Optional

import requests

TICKERS_URL = "https://www.sec.gov/files/company_tickers.json"
SUBMISSIONS_URL = "https://data.sec.gov/submissions/CIK{cik:010d}.json"
SHARES_URL = "https://data.sec.gov/api/xbrl/companyconcept/CIK{cik:010d}/dei/EntityCommonStockSharesOutstanding.json"

# (النماذج، عدد الأيام، الإجراء، الوزن، الوصف)
#   EXCLUDE = استبعاد السهم ، PENALTY = خصم من الدرجة
RISK_RULES = [
    ({"424B1", "424B2", "424B3", "424B4", "424B5", "424B7"}, 10, "EXCLUDE", 0,
     "نشرة طرح نهائية ({form}) بتاريخ {date} — طرح أسهم جارٍ/حديث (تخفيف)"),
    ({"25-NSE", "25"}, 120, "EXCLUDE", 0, "إشعار شطب من البورصة ({form}) بتاريخ {date}"),
    ({"424B1", "424B2", "424B3", "424B4", "424B5", "424B7"}, 60, "PENALTY", 15,
     "نشرة طرح ({form}) خلال آخر 60 يوماً ({date}) — تخفيف قريب"),
    ({"S-1", "S-1/A", "F-1", "F-1/A"}, 90, "PENALTY", 15, "تسجيل طرح أسهم ({form}) بتاريخ {date} — طرح محتمل"),
    ({"S-3", "S-3/A", "F-3", "F-3/A"}, 180, "PENALTY", 10, "تسجيل رف (Shelf) ({form}) بتاريخ {date} — يسمح بطرح في أي وقت"),
]
EIGHTK_ITEMS = {
    "3.01": (90, "PENALTY", 15, "8-K بند 3.01: إشعار من البورصة بعدم الامتثال/خطر الشطب ({date})"),
    "3.03": (60, "PENALTY", 10, "8-K بند 3.03: تعديل حقوق المساهمين — كثيراً ما يكون تجميعاً عكسياً ({date})"),
    "1.01": (30, "INFO", 0, "8-K بند 1.01: اتفاقية جوهرية ({date})"),
    "8.01": (5, "INFO", 0, "8-K بند 8.01: حدث آخر ({date})"),
}
PROXY_FORMS = {"DEF 14A", "PRE 14A"}  # قد تتضمن تصويتاً على تجميع عكسي — نذكرها كاحتمال فقط


@dataclass
class SecInfo:
    symbol: str
    ok: bool = False                     # هل نجح الجلب؟
    cik: Optional[int] = None
    name: Optional[str] = None
    exclude: List[str] = field(default_factory=list)
    penalties: List[tuple] = field(default_factory=list)   # (وزن، سبب)
    infos: List[str] = field(default_factory=list)
    shares_out: Optional[float] = None
    shares_out_date: Optional[str] = None
    recent_8k_days: Optional[float] = None   # منذ آخر 8-K (للأخبار الجوهرية)
    note: str = ""

    @property
    def penalty(self) -> int:
        return sum(w for w, _ in self.penalties)


class SecClient:
    def __init__(self, user_agent: Optional[str] = None, session: Optional[requests.Session] = None,
                 cache_dir: Optional[str] = None, max_rps: float = 8.0):
        ua = (user_agent or os.environ.get("SEC_USER_AGENT") or "").strip()
        self.enabled = "@" in ua      # SEC تطلب بريداً للتواصل
        self.s = session or requests.Session()
        self.s.headers.update({"User-Agent": ua or "headsup-personal", "Accept-Encoding": "gzip, deflate"})
        self.min_gap = 1.0 / max_rps
        self._last = 0.0
        self.cache_dir = cache_dir
        self._tickers: Optional[Dict[str, dict]] = None
        self.calls = 0
        self.errors: List[str] = []

    def _get(self, url: str) -> Optional[dict]:
        wait = self.min_gap - (time.monotonic() - self._last)
        if wait > 0:
            time.sleep(wait)
        self._last = time.monotonic()
        self.calls += 1
        try:
            r = self.s.get(url, timeout=20)
        except Exception as e:
            self.errors.append(f"{type(e).__name__}")
            return None
        if r.status_code == 404:
            return {}
        if r.status_code != 200:
            self.errors.append(f"HTTP {r.status_code}")
            return None
        try:
            return r.json()
        except Exception:
            self.errors.append("JSON")
            return None

    def tickers(self) -> Dict[str, dict]:
        if self._tickers is not None:
            return self._tickers
        path = os.path.join(self.cache_dir, "sec_tickers.json") if self.cache_dir else None
        if path and os.path.exists(path) and time.time() - os.path.getmtime(path) < 86400:
            try:
                self._tickers = json.load(open(path, encoding="utf-8"))
                return self._tickers
            except Exception:
                pass
        d = self._get(TICKERS_URL) or {}
        m = {}
        for v in d.values():
            t = str(v.get("ticker", "")).upper()
            if t:
                m[t] = {"cik": int(v["cik_str"]), "name": v.get("title")}
        self._tickers = m
        if path and m:
            json.dump(m, open(path, "w", encoding="utf-8"))
        return m

    def info(self, symbol: str, now: datetime) -> SecInfo:
        si = SecInfo(symbol)
        if not self.enabled:
            si.note = "بيانات SEC غير متوفرة: لم يُضبط SEC_USER_AGENT (اسم + بريد)"
            return si
        t = self.tickers()
        if not t:
            si.note = "بيانات SEC غير متوفرة: تعذر جلب قائمة الرموز"
            return si
        key = symbol.upper().replace(".", "-")
        rec = t.get(key) or t.get(symbol.upper())
        if not rec:
            si.note = "الرمز غير موجود في قائمة SEC (قد يكون صندوقاً أو شركة أجنبية لا تقدم إفصاحات EDGAR)"
            return si
        si.cik, si.name = rec["cik"], rec["name"]
        sub = self._get(SUBMISSIONS_URL.format(cik=si.cik))
        if sub is None:
            si.note = "بيانات SEC غير متوفرة: فشل جلب الإفصاحات"
            return si
        si.ok = True
        evaluate_filings(si, sub, now)
        sh = self._get(SHARES_URL.format(cik=si.cik))
        if sh:
            parse_shares(si, sh, now)
        return si


def _accepted(rec: dict, i: int) -> Optional[datetime]:
    acc = (rec.get("acceptanceDateTime") or [None] * (i + 1))[i]
    if acc:
        try:
            return datetime.fromisoformat(acc.replace("Z", "+00:00")).astimezone(timezone.utc)
        except ValueError:
            pass
    fd = (rec.get("filingDate") or [None] * (i + 1))[i]
    if fd:
        return datetime.fromisoformat(fd).replace(tzinfo=timezone.utc)
    return None


def evaluate_filings(si: SecInfo, sub: dict, now: datetime) -> None:
    rec = ((sub.get("filings") or {}).get("recent")) or {}
    forms = rec.get("form") or []
    seen = set()
    for i, form in enumerate(forms):
        when = _accepted(rec, i)
        if when is None or when > now:        # لا نستخدم ما لم يكن متاحاً وقت القرار
            continue
        age = (now - when).total_seconds() / 86400
        date = when.strftime("%Y-%m-%d")
        for forms_set, days, action, w, text in RISK_RULES:
            if form in forms_set and age <= days and (action, text[:12]) not in seen:
                seen.add((action, text[:12]))
                msg = text.format(form=form, date=date)
                if action == "EXCLUDE":
                    si.exclude.append(msg)
                else:
                    si.penalties.append((w, msg))
                break
        if form in ("8-K", "8-K/A", "6-K"):
            if si.recent_8k_days is None or age < si.recent_8k_days:
                si.recent_8k_days = age
            items = str((rec.get("items") or [""] * (i + 1))[i] or "")
            for it in [x.strip() for x in items.split(",") if x.strip()]:
                r = EIGHTK_ITEMS.get(it)
                if r and age <= r[0] and ("8k", it) not in seen:
                    seen.add(("8k", it))
                    msg = r[3].format(date=date)
                    if r[1] == "PENALTY":
                        si.penalties.append((r[2], msg))
                    else:
                        si.infos.append(msg)
        if form in PROXY_FORMS and age <= 60 and ("proxy",) not in seen:
            seen.add(("proxy",))
            si.infos.append(f"{form} بتاريخ {date}: تصويت للمساهمين — قد يشمل تجميعاً عكسياً أو زيادة أسهم (راجع الإفصاح)")


def parse_shares(si: SecInfo, d: dict, now: datetime) -> None:
    rows = ((d.get("units") or {}).get("shares")) or []
    best = None
    for r in rows:
        filed = r.get("filed")
        if not filed or datetime.fromisoformat(filed).replace(tzinfo=timezone.utc) > now:
            continue
        if best is None or (r.get("end", ""), filed) > (best.get("end", ""), best.get("filed")):
            best = r
    if best and best.get("val"):
        si.shares_out = float(best["val"])
        si.shares_out_date = best.get("end")

# -*- coding: utf-8 -*-
"""قواعد التنبيه المبكر (قبل الاختراق). كل قاعدة واضحة وقابلة للضبط من config.json.

الفكرة: سهم حجمه يرتفع بينما سعره متماسك في نطاق ضيق تحت مقاومة قريبة، بقيعان أعلى، فوق VWAP،
ولم يتحرك كثيراً بعد. التنبيه يُرسل قبل اختراق المقاومة فقط. السهم الذي اخترقها بالفعل لا يُنبَّه عليه.

كل الحسابات على الشمعة المغلقة الأخيرة وما قبلها فقط (لا نظر للمستقبل).
"""
import math
from dataclasses import dataclass, field, asdict
from typing import List, Optional

import numpy as np
import pandas as pd

import intraday as I

DEFAULTS = {
    "max_price": 5.0,
    "min_price": 0.20,           # تحت هذا السعر الأرقام غير موثوقة (أسهم بأجزاء السنت)
    "min_dollar_volume": 300_000,
    "max_day_change_pct": 25.0,  # ارتفع أكثر من هذا = لم يعد مبكراً
    "min_rvol": 2.0,
    "spike_mult": 3.0,           # شمعة حجمها ≥ 3× متوسط آخر 20 شمعة
    "window_bars": 12,           # نافذة التماسك: 12 شمعة × 5 دقائق = ساعة
    "max_range_atr": 3.0,        # مدى النافذة ≤ 3 × ATR(5m)
    "max_range_pct": 8.0,        # وأيضاً ≤ 8% من السعر
    "near_res_min_pct": 0.5,     # المسافة تحت المقاومة: من 0.5%
    "near_res_max_pct": 5.0,     #                       إلى 5%
    "max_spread_pct": 2.0,
    "min_score": 65,
    "shares_per_trade": 500,
    "target_r": 2.0,
    "slippage_pct": 0.5,         # انزلاق افتراضي عند الدخول إذا لم يتوفر سعر الطلب
}


@dataclass
class Setup:
    symbol: str
    name: str = ""
    price: Optional[float] = None
    price_time: Optional[str] = None
    price_age_sec: Optional[float] = None
    price_fresh: str = "DATA UNAVAILABLE"
    bid: Optional[float] = None
    ask: Optional[float] = None
    spread_pct: Optional[float] = None
    day_change_pct: Optional[float] = None
    day_volume: Optional[float] = None
    dollar_volume: Optional[float] = None
    avg_daily_volume20: Optional[float] = None
    vol_vs_avg: Optional[float] = None       # حجم اليوم حتى الآن ÷ متوسط 20 يوماً
    rvol: Optional[float] = None
    rvol_1h_ago: Optional[float] = None
    spike: Optional[float] = None
    range_pct: Optional[float] = None
    range_atr: Optional[float] = None
    higher_lows: bool = False
    above_vwap: bool = False
    vwap: Optional[float] = None
    ema_ok: bool = False
    rsi: Optional[float] = None
    macd_rising: bool = False
    resistance: Optional[float] = None
    support: Optional[float] = None
    dist_res_pct: Optional[float] = None
    trigger: Optional[float] = None          # شرط الدخول: اختراق هذا المستوى
    invalidation: Optional[float] = None     # إبطال الفكرة: كسر هذا المستوى
    stage: str = "NONE"                      # EARLY / BROKEN (فات) / NONE
    score: int = 0
    parts: dict = field(default_factory=dict)
    reasons: List[str] = field(default_factory=list)
    missing: List[str] = field(default_factory=list)
    risks: List[str] = field(default_factory=list)
    excluded: List[str] = field(default_factory=list)
    gates_failed: List[str] = field(default_factory=list)
    news_kind: Optional[str] = None
    news_headline: Optional[str] = None
    shares_out: Optional[float] = None
    shares_out_date: Optional[str] = None
    data_quality: int = 0
    data_quality_notes: List[str] = field(default_factory=list)
    data_note: str = ""
    bar_time: Optional[str] = None

    @property
    def qualifies(self) -> bool:
        return self.stage == "EARLY" and not self.gates_failed and not self.excluded

    def to_dict(self) -> dict:
        return asdict(self)


def tick(p: float) -> float:
    """أصغر وحدة سعر في السوق الأمريكي: سنت فوق 1$، و0.0001 تحته."""
    return 0.0001 if p < 1 else 0.01


def tick_up(p: float) -> float:
    t = tick(p)
    return round(math.ceil(round(p / t, 6)) * t, 4)


def tick_down(p: float) -> float:
    t = tick(p)
    return round(math.floor(round(p / t, 6)) * t, 4)


def macd_hist(close: pd.Series) -> pd.Series:
    m = I.ema(close, 12) - I.ema(close, 26)
    return m - I.ema(m, 9)


def _f(x) -> Optional[float]:
    try:
        x = float(x)
        return None if math.isnan(x) or math.isinf(x) else x
    except (TypeError, ValueError):
        return None


def evaluate_setup(sym: str, d: pd.DataFrame, cfg: dict, daily: Optional[pd.DataFrame] = None,
                   prev_close: Optional[float] = None) -> Setup:
    """d: شموع 5m للجلسة النظامية مع add_indicators. التقييم على آخر شمعة مغلقة."""
    st = Setup(sym)
    if d is None or len(d) < 40:
        st.missing.append("شموع 5 دقائق غير كافية لحساب المؤشرات")
        st.gates_failed.append("بيانات غير كافية")
        return st
    i = len(d) - 1
    row = d.iloc[i]
    today = d.index[i].date()
    td = d[d.index.date == today]
    st.bar_time = d.index[i].isoformat()
    close = float(row["close"])
    atr = _f(row["atr"])
    W = int(cfg["window_bars"])

    # ---------------- الحجم
    st.rvol = _f(row["rvol"])
    if len(td) > W:
        st.rvol_1h_ago = _f(td["rvol"].iloc[-W - 1])
    st.day_volume = float(td["volume"].sum())
    st.dollar_volume = float((td["volume"] * (td["high"] + td["low"] + td["close"]) / 3).sum())
    va = d["vol_avg20"].shift(1)   # متوسط سابق (لا يشمل الشمعة نفسها)
    recent = td.iloc[-W:]
    ratios = (recent["volume"] / va.reindex(recent.index)).replace([np.inf, -np.inf], np.nan)
    st.spike = _f(ratios.max())
    if daily is not None and len(daily) >= 5:
        past = daily[daily.index.date < today].tail(20)
        if len(past) >= 5:
            st.avg_daily_volume20 = float(past["volume"].mean())
            st.vol_vs_avg = st.day_volume / st.avg_daily_volume20 if st.avg_daily_volume20 else None
    if prev_close:
        st.day_change_pct = (close / prev_close - 1) * 100

    # ---------------- السعر: تماسك، قيعان أعلى، VWAP، المتوسطات، الزخم
    win = d.iloc[i - W + 1: i + 1]
    hh, ll = float(win["high"].max()), float(win["low"].min())
    st.range_pct = (hh - ll) / close * 100 if close else None
    st.range_atr = (hh - ll) / atr if atr else None
    k = max(W // 3, 2)
    lows = [float(win["low"].iloc[j * k:(j + 1) * k].min()) for j in range(3)]
    st.higher_lows = lows[0] < lows[1] < lows[2]
    st.vwap = _f(row["vwap"])
    st.above_vwap = bool(st.vwap is not None and close > st.vwap)
    e9, e20 = _f(row["ema9"]), _f(row["ema20"])
    e9_prev = _f(d["ema9"].iloc[i - 3])
    st.ema_ok = bool(e9 and e20 and (e9 > e20 or (e9_prev and e9 > e9_prev and (e20 - e9) / e20 < 0.005)))
    st.rsi = _f(row["rsi"])
    mh = macd_hist(d["close"])
    st.macd_rising = bool(len(mh) > 3 and mh.iloc[-1] > mh.iloc[-2] > mh.iloc[-3])

    # ---------------- المقاومة والدعم (مستويات معروفة حتى هذه الشمعة فقط)
    lv = I.levels_at(d, i)
    before = td.iloc[:-W]
    if len(before):
        lv.append(float(before["high"].max()))       # قمة اليوم قبل نافذة التماسك
    # المقاومة = أقرب مستوى معروف يبعد على الأقل near_res_min_pct (القمم الصغيرة الملاصقة للسعر داخل التماسك لا تُحسب)
    res = sorted(x for x in lv if x >= close * (1 + cfg["near_res_min_pct"] / 100))
    sup = sorted((x for x in lv if x < close), reverse=True)
    st.resistance = res[0] if res else None
    st.support = sup[0] if sup else None
    if st.resistance:
        st.dist_res_pct = (st.resistance / close - 1) * 100

    st.stage = "EARLY"   # يتحول إلى BROKEN أدناه إذا كان عند قمم جديدة أو تحرك كثيراً

    # ---------------- خطة: شرط الدخول ومستوى الإبطال
    if st.resistance:
        st.trigger = tick_up(st.resistance + tick(st.resistance))
    inval = lows[2] if st.higher_lows else ll
    if atr:
        inval = min(inval, close - 0.5 * atr)
    st.invalidation = tick_down(inval - tick(inval))

    # ---------------- البوابات الإلزامية
    g = st.gates_failed
    if not (cfg["min_price"] <= close <= cfg["max_price"]):
        g.append(f"السعر {close:.4g}$ خارج النطاق {cfg['min_price']}–{cfg['max_price']}$")
    if st.dollar_volume < cfg["min_dollar_volume"]:
        g.append(f"الحجم بالدولار ${st.dollar_volume:,.0f} أقل من ${cfg['min_dollar_volume']:,.0f}")
    if st.rvol is None:
        g.append("RVOL غير متوفر (تاريخ غير كافٍ)")
        st.missing.append("RVOL")
    elif st.rvol < cfg["min_rvol"]:
        g.append(f"RVOL {st.rvol:.1f} أقل من {cfg['min_rvol']}")
    if st.day_change_pct is not None and st.day_change_pct > cfg["max_day_change_pct"]:
        g.append(f"ارتفع {st.day_change_pct:.0f}% اليوم — لم يعد مبكراً")
        st.stage = "BROKEN"
    if st.dist_res_pct is None:
        g.append("لا مقاومة معروفة فوق السعر — السهم عند قمم جديدة (فات التبكير)")
        st.stage = "BROKEN"
    elif not (cfg["near_res_min_pct"] <= st.dist_res_pct <= cfg["near_res_max_pct"]):
        g.append(f"المسافة للمقاومة {st.dist_res_pct:.1f}% خارج {cfg['near_res_min_pct']}–{cfg['near_res_max_pct']}%")
    if not st.above_vwap:
        g.append("السعر تحت VWAP")

    # ---------------- الدرجة من 100
    p = {"الحجم": 0, "التماسك": 0, "الاتجاه": 0, "الزخم": 0, "الأخبار": 0}
    R = st.reasons
    if st.rvol is not None:
        p["الحجم"] += 15 if st.rvol >= 3 else 10 if st.rvol >= cfg["min_rvol"] else 0
        if st.rvol >= cfg["min_rvol"]:
            R.append(f"حجم نسبي {st.rvol:.1f}× مقارنة بنفس الوقت في الأيام السابقة")
    if st.rvol is not None and st.rvol_1h_ago is not None and st.rvol > st.rvol_1h_ago * 1.1:
        p["الحجم"] += 5; R.append(f"الحجم النسبي يتصاعد (كان {st.rvol_1h_ago:.1f}× قبل ساعة)")
    if st.spike is not None and st.spike >= cfg["spike_mult"]:
        p["الحجم"] += 5; R.append(f"قفزة حجم: شمعة بحجم {st.spike:.1f}× المتوسط خلال الساعة الأخيرة")
    if st.dollar_volume >= 2 * cfg["min_dollar_volume"]:
        p["الحجم"] += 5
    tight = (st.range_atr is not None and st.range_atr <= cfg["max_range_atr"]) and \
            (st.range_pct is not None and st.range_pct <= cfg["max_range_pct"])
    if tight:
        p["التماسك"] += 15; R.append(f"تماسك في نطاق ضيق آخر ساعة ({st.range_pct:.1f}% = {st.range_atr:.1f}× ATR)")
    if st.higher_lows:
        p["التماسك"] += 10; R.append("قيعان أعلى متتالية خلال آخر ساعة")
    if st.dist_res_pct is not None and cfg["near_res_min_pct"] <= st.dist_res_pct <= cfg["near_res_max_pct"]:
        p["التماسك"] += 10 if st.dist_res_pct <= 3 else 6
        R.append(f"تحت المقاومة {I.fmt_price(st.resistance)} بـ {st.dist_res_pct:.1f}% فقط — لم يخترق بعد")
    if st.above_vwap:
        p["الاتجاه"] += 8; R.append(f"فوق VWAP ({I.fmt_price(st.vwap)})")
    if st.ema_ok:
        p["الاتجاه"] += 7; R.append("EMA9 فوق EMA20 أو تقطعها للأعلى")
    if st.macd_rising:
        p["الاتجاه"] += 5; R.append("MACD: الهيستوجرام يرتفع 3 شموع متتالية")
    if st.rsi is not None and 45 <= st.rsi <= 70:
        p["الزخم"] += 5
    elif st.rsi is not None and st.rsi > 75:
        st.risks.append(f"RSI {st.rsi:.0f} — تشبع شراء، احتمال تراجع قبل الاختراق")
    st.parts = p
    return st


def apply_news(st: Setup, summary: dict) -> None:
    if not summary.get("available"):
        st.missing.append("الأخبار")
        return
    best = summary.get("best")
    st.news_kind = best
    first = next((x for x in summary["items"] if x["kind"] == best), None)
    st.news_headline = first["headline"] if first else None
    if best == "MATERIAL":
        st.parts["الأخبار"] = 10; st.reasons.append(f"خبر جوهري: {st.news_headline[:90]}")
    elif best == "OTHER":
        st.parts["الأخبار"] = 3
    elif best == "PROMO":
        st.parts["الأخبار"] = 0; st.risks.append(f"خبر ترويجي على الأغلب: {st.news_headline[:90]}")
    elif best == "RISK":
        st.parts["الأخبار"] = 0; st.risks.append(f"خبر مخاطرة: {st.news_headline[:90]}")
        st.parts["خصم"] = st.parts.get("خصم", 0) - 10
    elif best is None:
        st.parts["الأخبار"] = 3   # لا أخبار: محايد


def apply_sec(st: Setup, si) -> None:
    if not si.ok:
        st.missing.append("إفصاحات SEC")
        if si.note:
            st.data_quality_notes.append(si.note)
        return
    st.name = si.name or st.name
    st.shares_out, st.shares_out_date = si.shares_out, si.shares_out_date
    if si.shares_out is None:
        st.missing.append("عدد الأسهم القائمة")
    st.excluded.extend(si.exclude)
    for w, msg in si.penalties:
        st.risks.append(msg)
    if si.penalty:
        st.parts["خصم"] = st.parts.get("خصم", 0) - si.penalty
    for msg in si.infos:
        (st.risks if "تصويت" in msg else st.reasons).append(("إفصاح SEC: " + msg) if "تصويت" not in msg else msg)


def apply_price(st: Setup, pc, cfg: dict) -> None:
    st.price = pc.price
    st.price_time = pc.trade_time_utc.isoformat() if pc.trade_time_utc else None
    st.price_age_sec = pc.age_sec
    st.price_fresh = pc.freshness
    st.bid, st.ask, st.spread_pct = pc.bid, pc.ask, pc.spread_pct
    if pc.spread_pct is None:
        st.missing.append("السبريد (لا عرض/طلب على IEX)")
    elif pc.spread_pct > cfg["max_spread_pct"]:
        st.gates_failed.append(f"السبريد {pc.spread_pct:.1f}% أكبر من {cfg['max_spread_pct']}%")


def finalize(st: Setup, iex_share: Optional[float], sip_ok: bool) -> None:
    st.score = int(max(0, min(100, sum(st.parts.values()))))
    q, notes = 0, st.data_quality_notes
    if st.price_fresh == "FRESH":
        q += 25
    elif st.price_fresh == "DELAYED":
        q += 12; notes.append("آخر صفقة على IEX ليست لحظية")
    else:
        notes.append(f"السعر: {st.price_fresh}")
    if st.spread_pct is not None:
        q += 10
    if sip_ok:
        q += 20
    else:
        notes.append("بيانات السوق الكامل (SIP) غير متاحة — IEX فقط")
    if iex_share is not None:
        q += 15 if iex_share >= 0.05 else 7
        if iex_share < 0.05:
            notes.append(f"حصة IEX من الحجم {iex_share:.1%} فقط — السعر اللحظي أقل دقة")
    if "إفصاحات SEC" not in st.missing:
        q += 15
    if "الأخبار" not in st.missing:
        q += 10
    if st.shares_out is not None:
        q += 5
    st.data_quality = q


def quality_label(q: int) -> str:
    return "جيدة" if q >= 80 else "متوسطة" if q >= 55 else "ضعيفة"

# -*- coding: utf-8 -*-
"""دورة واحدة: مسح ← تقييم ← تنبيه ← صفقات افتراضية ← متابعة. تُشغَّل كل ساعة من GitHub Actions.

مراحل المسح:
 1) لقطة لكل الأسهم الأمريكية المدرجة (بدون OTC) — السوق الكامل متأخر 15 دقيقة (delayed_sip)، وإن رُفض: IEX.
 2) قائمة قصيرة (أسهم تحت 5$ بحجم دولاري كافٍ ولم تتحرك كثيراً) ← شموع 5m: SIP حتى قبل 16 دقيقة + IEX للحظة.
 3) القواعد المبكرة ← SEC والأخبار للمؤهلين فقط ← الدرجة ← تنبيه.
"""
import json
import os
import time
from datetime import datetime, timedelta
from typing import Dict, List, Optional, Tuple

import pandas as pd

import intraday as I
from hu import news as N
from hu import rules as RL
from hu import trades as TR
from hu.sec import SecClient
from hu.store import Store

ET, UTC = I.ET, I.UTC


def load_cfg(path: str) -> dict:
    cfg = dict(RL.DEFAULTS)
    if os.path.exists(path):
        cfg.update(json.load(open(path, encoding="utf-8")))
    return cfg


def fmt_vol(v: Optional[float]) -> str:
    if v is None:
        return "غير متوفر"
    for div, suf in ((1e9, "B"), (1e6, "M"), (1e3, "K")):
        if abs(v) >= div:
            return f"{v / div:.1f}{suf}"
    return f"{v:.0f}"


def et_str(iso: Optional[str]) -> str:
    if not iso:
        return "غير متوفر"
    return datetime.fromisoformat(iso).astimezone(ET).strftime("%H:%M")


# ====================================================================== المرحلة 1
def sweep(client: I.AlpacaClient, cfg: dict, now: datetime) -> Tuple[pd.DataFrame, str]:
    assets = client._get(I.PAPER_BASE, "/v2/assets", {"status": "active", "asset_class": "us_equity"})
    names, uni = {}, []
    for a in assets:
        sym = a.get("symbol") or ""
        if not a.get("tradable") or a.get("exchange") not in I.SCAN_EXCHANGES:
            continue
        if not sym.replace(".", "").isalpha() or ("." in sym and sym.split(".")[-1] not in ("A", "B", "C")):
            continue
        uni.append(sym); names[sym] = a.get("name") or ""
    feed_note = "السوق الكامل متأخر 15 دقيقة (delayed_sip)"
    try:
        snaps = client.snapshots(uni[:100], feed="delayed_sip")
        feed = "delayed_sip"
    except I.ApiError:
        feed, feed_note = "iex", "IEX فقط (رُفضت بيانات السوق الكامل المتأخرة) — الأحجام جزئية"
        snaps = {}
    snaps.update(client.snapshots(uni[100:] if feed == "delayed_sip" else uni, feed=feed))
    et_now = now.astimezone(ET)
    mins = max(1, min(390, (et_now.hour * 60 + et_now.minute) - 570))
    frac = mins / 390
    rows = []
    for s in uni:
        sn = snaps.get(s) or {}
        db, pb, lt = sn.get("dailyBar") or {}, sn.get("prevDailyBar") or {}, sn.get("latestTrade") or {}
        px = lt.get("p") or db.get("c")
        if not px or not pb.get("c"):
            continue
        v, pv = float(db.get("v") or 0), float(pb.get("v") or 0)
        vw = float(db.get("vw") or px)
        rows.append({"symbol": s, "name": names.get(s, ""), "price": float(px), "prev_close": float(pb["c"]),
                     "chg": (float(px) / float(pb["c"]) - 1) * 100, "day_high": float(db.get("h") or px),
                     "volume": v, "dollar_vol": v * vw, "prev_vol": pv,
                     "vol_jump": (v / (pv * frac)) if pv > 0 else None,
                     "trade_t": lt.get("t")})
    df = pd.DataFrame(rows)
    df.attrs["universe"] = len(uni)
    return df, feed_note


def shortlist(df: pd.DataFrame, cfg: dict, n: int = 60) -> pd.DataFrame:
    if df.empty:
        return df
    m = (df.price.between(cfg["min_price"], cfg["max_price"] * 1.05) & (df.dollar_vol >= cfg["min_dollar_volume"] * 0.5)
         & df.chg.between(-5, cfg["max_day_change_pct"] + 5))
    x = df[m].copy()
    x["rank"] = x["vol_jump"].fillna(0)
    return x.sort_values("rank", ascending=False).head(n)


def baseline_pick(df: pd.DataFrame, cfg: dict, taken: set, n: int = 10) -> pd.DataFrame:
    """طريقة المقارنة: أي سهم تحت 5$ قفز حجمه (≥ 2× المعتاد لهذا الوقت)."""
    if df.empty:
        return df
    m = (df.price.between(cfg["min_price"], cfg["max_price"]) & (df.dollar_vol >= cfg["min_dollar_volume"])
         & (df.vol_jump >= 2) & ~df.symbol.isin(taken))
    return df[m].sort_values("vol_jump", ascending=False).head(n)


# ====================================================================== التنبيه
def alert_text(st: RL.Setup, data_note: str) -> str:
    L = [f"🔔 إشارة مبكرة — {st.symbol}" + (f" ({st.name[:40]})" if st.name else ""),
         f"💵 السعر {I.fmt_price(st.price)} — آخر صفقة على IEX {et_str(st.price_time)} نيويورك"
         + (f" (قبل {st.price_age_sec:.0f} ث)" if st.price_age_sec is not None else ""),
         f"⏱️ {data_note}",
         f"📊 الحجم اليوم حتى الآن {fmt_vol(st.day_volume)}"
         + (f" = {st.vol_vs_avg:.1f}× متوسط يوم كامل (20 يوماً)" if st.vol_vs_avg else " (متوسط 20 يوماً غير متوفر)")
         + (f" • RVOL {st.rvol:.1f}×" if st.rvol else ""),
         "🟡 الحالة: مبكرة — لم يحدث اختراق بعد",
         "🔎 لماذا ظهر:"] + [f"• {r}" for r in st.reasons[:7]] + [
         f"🧱 أقرب دعم {I.fmt_price(st.support)} • أقرب مقاومة {I.fmt_price(st.resistance)}",
         f"▶️ شرط الدخول: اختراق {I.fmt_price(st.trigger)} بحجم قوي",
         f"⛔ إبطال الفكرة: كسر {I.fmt_price(st.invalidation)}"]
    L.append("⚠️ المخاطر: " + (" | ".join(st.risks[:4]) if st.risks else "لا مخاطر ظاهرة في إفصاحات SEC والأخبار المتاحة"))
    so = f"{fmt_vol(st.shares_out)} (حتى {st.shares_out_date})" if st.shares_out else "غير متوفر"
    L.append(f"🏷️ الأسهم القائمة: {so} • Float: غير متوفر")
    if st.spread_pct is not None:
        L.append(f"↔️ السبريد على IEX: {st.spread_pct:.2f}%")
    if st.missing:
        L.append("❔ غير متوفر: " + "، ".join(dict.fromkeys(st.missing)))
    L.append(f"⭐ الدرجة {st.score}/100 • جودة البيانات: {RL.quality_label(st.data_quality)} ({st.data_quality}/100)")
    L.append("ليست توصية شراء.")
    return "\n".join(L)


# ====================================================================== الدورة
class Engine:
    def __init__(self, client: I.AlpacaClient, store: Store, cfg: dict, sec: SecClient,
                 notifier: Optional[I.TelegramNotifier] = None, log=print):
        self.c, self.db, self.cfg, self.sec, self.tg, self.log = client, store, cfg, sec, notifier, log
        self.errors: List[str] = []

    def send(self, text: str) -> bool:
        if self.tg is None or not self.tg.ready:
            return False
        ok = self.tg.send(text)
        if not ok:
            self.errors.append("Telegram: " + (self.tg.last_error or "فشل"))
        return ok

    # ---------------------------------------------------------------- scan
    def run(self, kind: str = "scan", scheduled_utc: Optional[datetime] = None) -> dict:
        t0 = time.time()
        clock, clock_err = {}, None
        try:
            clock = self.c.clock()          # يضبط فرق الساعة مع Alpaca أولاً
        except I.ApiError as e:
            clock_err = e.message
        now = self.c.now_utc()
        day = now.astimezone(ET).strftime("%Y-%m-%d")
        info = {"kind": kind, "started_utc": now.isoformat(), "scheduled_utc": scheduled_utc.isoformat() if scheduled_utc else None,
                "delay_min": round((now - scheduled_utc).total_seconds() / 60, 1) if scheduled_utc else None,
                "universe": 0, "swept": 0, "shortlist": 0, "qualified": 0, "alerts": 0}
        calls0 = I.API_STATS["total"]
        self.run_id = self.db.insert("runs", {"kind": kind, "started_utc": info["started_utc"]})
        info["market_open"] = int(bool(clock.get("is_open")))
        if clock_err:
            self.errors.append("clock: " + clock_err)
        snap_df = pd.DataFrame()
        if info["market_open"] or kind == "final":
            try:
                snap_df, info["feed_note"] = sweep(self.c, self.cfg, now)
                info["swept"] = len(snap_df)
                info["universe"] = snap_df.attrs.get("universe", 0)
            except I.ApiError as e:
                self.errors.append("sweep: " + e.message)
        if info["market_open"] and kind == "scan" and not snap_df.empty:
            self.scan(now, day, snap_df, info)
        # متابعة كل الصفقات والتنبيهات المفتوحة لهذا اليوم
        try:
            self.follow(now, day, final=(kind == "final"))
        except I.ApiError as e:
            self.errors.append("follow: " + e.message)
        if kind == "final":
            if not snap_df.empty:
                self.missed(day, snap_df)
            self.daily_summary(day)
        info["api_calls"] = I.API_STATS["total"] - calls0
        info["sec_calls"] = self.sec.calls
        info["duration_sec"] = round(time.time() - t0, 1)
        info["errors"] = " | ".join(self.errors + self.sec.errors[:5])[:2000]
        self.db.update("runs", self.run_id, **{k: v for k, v in info.items() if k != "kind"})
        self.db.commit()
        return info

    def scan(self, now: datetime, day: str, snap_df: pd.DataFrame, info: dict) -> None:
        # أول مرة يظهر فيها سهم تحت 5$ مرتفعاً 10%+ (لقياس هل الفحص كل ساعة متأخر)
        mv = snap_df[(snap_df.price <= self.cfg["max_price"]) & (snap_df.chg >= 10)]
        for _, r in mv.iterrows():
            self.db.db.execute("INSERT OR IGNORE INTO movers VALUES (?,?,?,?,?)",
                               (day, r.symbol, now.isoformat(), round(r.chg, 1), r.price))
        sl = shortlist(snap_df, self.cfg)
        info["shortlist"] = len(sl)
        syms = list(sl.symbol)
        if not syms:
            return
        cache = I.BarCache(hybrid=True)
        b5, _ = cache.get(self.c, syms)
        try:
            daily = self.c.bars(syms, "1Day", now - timedelta(days=45), now - timedelta(minutes=16), feed="sip")
        except I.ApiError:
            daily = {}
        live = self.c.snapshots(syms)                       # IEX لحظي
        meta = sl.set_index("symbol")
        setups: List[RL.Setup] = []
        for s in syms:
            df = b5.get(s)
            if df is None or df.empty:
                continue
            d5 = I.regular_session(I.to_et(I.drop_forming_bar(df, 5, now)))
            if len(d5) < 40:
                continue
            d5 = I.add_indicators(d5, self.c.cfg)
            dd = daily.get(s)
            dd = I.to_et(dd) if dd is not None and len(dd) else None
            st = RL.evaluate_setup(s, d5, self.cfg, dd, float(meta.at[s, "prev_close"]))
            st.name = meta.at[s, "name"]
            pc = I.price_from_snapshot(s, live.get(s), True, now, self.c.cfg)
            RL.apply_price(st, pc, self.cfg)
            if pc.price and st.resistance and pc.price >= st.resistance:
                st.gates_failed.append(f"السعر اللحظي {I.fmt_price(pc.price)} تجاوز المقاومة — فات التبكير")
                st.stage = "BROKEN"
            st.data_note = cache.describe(s) or "البيانات: IEX فقط"
            setups.append(st)
        # SEC والأخبار للمؤهلين فقط (اقتصاد في الطلبات)
        pre = [st for st in setups if st.stage == "EARLY" and not st.gates_failed]
        raw_news = self.c.news([st.symbol for st in pre], 24) if pre else []
        for st in pre:
            si = self.sec.info(st.symbol, now)
            RL.apply_sec(st, si)
            RL.apply_news(st, N.summarize(I.news_for_symbol(raw_news, st.symbol), si.recent_8k_days))
        for st in setups:
            ratio = cache.vol_ratio.get(st.symbol)
            RL.finalize(st, (1 / ratio) if ratio else None, cache.sip_ok)
        run_id = self.run_id
        for st in setups:
            self.db.insert("candidates", {"run_id": run_id, "day": day, "symbol": st.symbol, "score": st.score,
                                          "stage": st.stage, "qualifies": int(st.qualifies and st.score >= self.cfg["min_score"]),
                                          "data": st.to_dict()})
        good = sorted([st for st in setups if st.qualifies and st.score >= self.cfg["min_score"]], key=lambda x: -x.score)
        info["qualified"] = len(good)
        for st in good:
            if self.maybe_alert(st, now, day, run_id, meta):
                info["alerts"] += 1
        # طريقة المقارنة
        taken = {r["symbol"] for r in self.db.q("SELECT symbol FROM trades WHERE day=? AND kind='BASE'", (day,))}
        for _, r in baseline_pick(snap_df, self.cfg, taken).iterrows():
            pc = I.price_from_snapshot(r.symbol, live.get(r.symbol), True, now, self.c.cfg) if r.symbol in live else None
            px = pc.price if pc and pc.freshness in ("FRESH", "DELAYED") else None
            if not px:
                continue
            entry = RL.tick_up(pc.ask if pc.ask and pc.spread_pct is not None and pc.spread_pct < 5 else px * (1 + self.cfg["slippage_pct"] / 100))
            stop_pct = self.median_stop_pct(day)
            stop = RL.tick_down(entry * (1 - stop_pct / 100))
            self.db.insert("trades", {"kind": "BASE", "day": day, "symbol": r.symbol, "created_utc": now.isoformat(),
                                      "ref_price": px, "entry_utc": now.isoformat(), "entry": entry, "stop": stop,
                                      "target": RL.tick_up(entry + self.cfg["target_r"] * (entry - stop)),
                                      "shares": self.cfg["shares_per_trade"], "status": "OPEN",
                                      "note": f"حجم قفز {r.vol_jump:.1f}× — وقف {stop_pct:.1f}%"})

    def median_stop_pct(self, day: str) -> float:
        rows = self.db.q("SELECT entry, stop FROM trades WHERE kind='A' AND entry > stop")
        v = sorted((r["entry"] - r["stop"]) / r["entry"] * 100 for r in rows)
        return round(v[len(v) // 2], 2) if v else 5.0

    def maybe_alert(self, st: RL.Setup, now: datetime, day: str, run_id: int, meta: pd.DataFrame) -> bool:
        prev = self.db.one("SELECT * FROM alerts WHERE day=? AND symbol=? ORDER BY id DESC LIMIT 1", (day, st.symbol))
        if prev:
            if prev["state"] != "OPEN":
                return False   # تفعّلت أو أُبطلت اليوم: لا تنبيه مبكر جديد لنفس السهم
            old = json.loads(prev["data"])
            new_risk = set(st.risks) - set(old.get("risks", []))
            if st.score - prev["score"] >= 15:
                head = f"🔁 تحديث جوهري — {st.symbol}: الدرجة ارتفعت من {prev['score']} إلى {st.score}"
            elif new_risk:
                head = f"🔁 تحديث — {st.symbol}: خطر جديد: {next(iter(new_risk))[:100]}"
            elif prev["price"] and st.price and abs(st.price / prev["price"] - 1) >= 0.10:
                head = f"🔁 تحديث — {st.symbol}: السعر تحرك {(st.price / prev['price'] - 1) * 100:+.0f}% منذ التنبيه ولم يخترق"
            else:
                return False
            if not self.db.once(f"upd:{day}:{st.symbol}:{st.score // 15}:{len(st.risks)}", day, now.isoformat()):
                return False
            self.send(head + "\n" + f"شرط الدخول {I.fmt_price(st.trigger)} • الإبطال {I.fmt_price(st.invalidation)}\nليست توصية شراء.")
            self.db.update("alerts", prev["id"], score=st.score, trigger=st.trigger, invalidation=st.invalidation, data=json.dumps(st.to_dict(), ensure_ascii=False, default=str))
            return False
        if st.price is None or st.trigger is None or st.invalidation is None or st.invalidation >= st.price:
            return False
        msg = alert_text(st, "بيانات السوق الكامل متأخرة 15 دقيقة، والسعر اللحظي من IEX فقط\n🧮 " + st.data_note)
        sent = self.send(msg)
        aid = self.db.insert("alerts", {"day": day, "symbol": st.symbol, "run_id": run_id, "alert_utc": now.isoformat(),
                                        "kind": "EARLY", "score": st.score, "price": st.price, "trigger": st.trigger,
                                        "invalidation": st.invalidation, "data_quality": st.data_quality,
                                        "gain_from_open": st.day_change_pct, "state": "OPEN", "sent": int(sent),
                                        "message": msg, "data": st.to_dict()})
        sh = int(self.cfg["shares_per_trade"])
        entry = st.ask if (st.ask and st.spread_pct is not None and st.spread_pct <= self.cfg["max_spread_pct"]) \
            else st.price * (1 + self.cfg["slippage_pct"] / 100)
        entry = RL.tick_up(entry)
        if entry > st.invalidation:
            self.db.insert("trades", {"alert_id": aid, "kind": "A", "day": day, "symbol": st.symbol, "created_utc": now.isoformat(),
                                      "ref_price": st.price, "trigger": st.trigger, "entry_utc": now.isoformat(), "entry": entry,
                                      "stop": st.invalidation, "target": RL.tick_up(entry + self.cfg["target_r"] * (entry - st.invalidation)),
                                      "shares": sh, "status": "OPEN", "note": "دخول عند التنبيه"})
        self.db.insert("trades", {"alert_id": aid, "kind": "B", "day": day, "symbol": st.symbol, "created_utc": now.isoformat(),
                                  "ref_price": st.price, "trigger": st.trigger, "stop": st.invalidation, "shares": sh,
                                  "status": "PENDING", "note": "أمر معلّق فوق مستوى التفعيل"})
        return True

    # ---------------------------------------------------------------- follow-up
    def follow(self, now: datetime, day: str, final: bool) -> None:
        trades = self.db.q("SELECT * FROM trades WHERE day=? AND status IN ('OPEN','PENDING')", (day,))
        alerts = self.db.q("SELECT * FROM alerts WHERE day=? AND state='OPEN'", (day,))
        syms = sorted({t["symbol"] for t in trades} | {a["symbol"] for a in alerts})
        if not syms:
            return
        cut = now - timedelta(minutes=16)            # السوق الكامل المسموح مجاناً (أقدم من 15 دقيقة)
        start = min(datetime.fromisoformat(x) for x in [t["created_utc"] for t in trades] + [a["alert_utc"] for a in alerts])
        bars: Dict[str, pd.DataFrame] = {}
        for i in range(0, len(syms), 50):
            bars.update(self.c.bars(syms[i:i + 50], "1Min", start - timedelta(minutes=1), cut, feed="sip"))
        for t in trades:
            r = TR.simulate(t, bars.get(t["symbol"]), cut, self.cfg["slippage_pct"], self.cfg["target_r"])
            self.db.update("trades", t["id"], **{k: v for k, v in r.items() if k in
                                                 ("status", "entry", "entry_utc", "target", "note", "exit", "exit_utc", "pnl", "r_mult", "pct")})
        for a in alerts:
            ev = TR.alert_events(a, bars.get(a["symbol"]), cut)
            if not ev:
                continue
            if ev["state"] == "ACTIVATED":
                self.db.update("alerts", a["id"], state="ACTIVATED", activated_utc=ev["at"], lead_min=ev["lead_min"])
                if self.db.once(f"act:{a['id']}", day, now.isoformat()):
                    self.send(f"✅ تفعّلت — {a['symbol']}: اخترق {I.fmt_price(a['trigger'])} الساعة {et_str(ev['at'])} نيويورك "
                              f"(بعد {ev['lead_min']:.0f} دقيقة من التنبيه).\nالإبطال ما زال {I.fmt_price(a['invalidation'])}. "
                              f"البيانات من السوق الكامل متأخرة 15 دقيقة. ليست توصية.")
            elif ev["state"] == "INVALIDATED":
                self.db.update("alerts", a["id"], state="INVALIDATED", invalidated_utc=ev["at"])
                if self.db.once(f"inv:{a['id']}", day, now.isoformat()):
                    self.send(f"❌ أُلغيت — {a['symbol']}: كسر مستوى الإبطال {I.fmt_price(a['invalidation'])} "
                              f"الساعة {et_str(ev['at'])} نيويورك قبل أن يخترق.")
            elif ev["state"] == "EXPIRED":
                self.db.update("alerts", a["id"], state="EXPIRED")

    # ---------------------------------------------------------------- end of day
    def missed(self, day: str, snap_df: pd.DataFrame) -> None:
        """الأسهم تحت 5$ التي ارتفعت 30%+ اليوم بلا تنبيه — حتى لا نتجاهل ما فات."""
        if snap_df.empty:
            return
        m = snap_df[(snap_df.prev_close <= self.cfg["max_price"]) & (snap_df.prev_close >= self.cfg["min_price"])
                    & (snap_df.dollar_vol >= self.cfg["min_dollar_volume"])]
        m = m.assign(max_gain=(m.day_high / m.prev_close - 1) * 100)
        m = m[m.max_gain >= 30]
        alerted = {r["symbol"] for r in self.db.q("SELECT symbol FROM alerts WHERE day=?", (day,))}
        for _, r in m.iterrows():
            if r.symbol in alerted:
                continue
            c = self.db.q("SELECT score, data FROM candidates WHERE day=? AND symbol=? ORDER BY score DESC LIMIT 1", (day, r.symbol))
            if c:
                d = json.loads(c[0]["data"])
                reason = "؛ ".join((d.get("excluded") or []) + (d.get("gates_failed") or []))[:300] or f"الدرجة {c[0]['score']} أقل من الحد"
            else:
                f = self.db.one("SELECT * FROM movers WHERE day=? AND symbol=?", (day, r.symbol))
                if f and f["first_chg"] > self.cfg["max_day_change_pct"]:
                    reason = (f"تحرك بين فحصين: أول ظهور الساعة {et_str(f['first_utc'])} نيويورك وقد ارتفع "
                              f"{f['first_chg']:.0f}% بالفعل — الفحص كل ساعة كان متأخراً")
                elif f:
                    reason = (f"ظهر الساعة {et_str(f['first_utc'])} مرتفعاً {f['first_chg']:.0f}% لكنه لم يدخل القائمة القصيرة "
                              "(حجم دولاري أو قفزة حجم غير كافية)")
                else:
                    reason = "لم يظهر في أي فحص قبل الحركة — قفز بين فحصين أو بعد آخر فحص"
            self.db.db.execute("INSERT OR REPLACE INTO missed VALUES (?,?,?,?,?,?,?,?,?)",
                               (day, r.symbol, r.prev_close, r.day_high, round(r.max_gain, 1), round(r.chg, 1),
                                int(bool(c)), c[0]["score"] if c else None, reason))

    def daily_summary(self, day: str) -> None:
        if not self.db.once(f"daily:{day}", day, datetime.now(UTC).isoformat()):
            return
        al = self.db.q("SELECT * FROM alerts WHERE day=?", (day,))
        tr = self.db.q("SELECT * FROM trades WHERE day=?", (day,))
        sA, sB, sBase = (TR.summary([t for t in tr if t["kind"] == k]) for k in ("A", "B", "BASE"))
        ms = self.db.q("SELECT COUNT(*) AS n FROM missed WHERE day=?", (day,))[0]["n"]
        act = [a for a in al if a["state"] == "ACTIVATED"]
        inv = [a for a in al if a["state"] == "INVALIDATED"]

        def line(name, s):
            if not s.get("trades"):
                return f"{name}: لا صفقات مغلقة"
            return (f"{name}: {s['trades']} صفقة • ربح {s['win_rate']:.0%} • صافي ${s['total_pnl']:+,.0f} • "
                    f"متوسط {s['avg_pct']:+.1f}%")
        txt = [f"📋 ملخص {day}",
               f"تنبيهات مبكرة: {len(al)} • تفعّلت {len(act)} • أُلغيت {len(inv)} • بلا حسم {len(al) - len(act) - len(inv)}",
               line("A دخول عند التنبيه", sA), line("B دخول عند الاختراق", sB), line("المقارنة (أي قفزة حجم)", sBase),
               f"فاتت (ارتفعت 30%+ بلا تنبيه): {ms}",
               "صفقات افتراضية فقط — لا أوامر حقيقية."]
        if act:
            leads = sorted(a["lead_min"] for a in act if a["lead_min"] is not None)
            if leads:
                txt.insert(2, f"متوسط السبق قبل الاختراق: {sum(leads) / len(leads):.0f} دقيقة")
        self.send("\n".join(txt))

# -*- coding: utf-8 -*-
"""تمييز الخبر الجوهري من الترويجي — قواعد كلمات واضحة (بدون ذكاء اصطناعي)، وقد تخطئ.

جوهري: حدث له أثر محدد وقابل للتحقق (أرقام، موافقة، عقد بقيمة، نتائج، استحواذ)، ويقوى إذا صاحبه 8-K.
ترويجي: لغة تسويقية أو نوايا بلا أرقام ("يستكشف"، "يخطط"، "رؤية"، "ثوري")، أو مقال رأي/ترويج مدفوع.
"""
import re
from typing import List, Optional

import intraday as I

MATERIAL = re.compile(
    r"\b(fda (approval|approves|clearance|grants)|approved by|phase [123i]+ (results|data)|topline|"
    r"definitive agreement|to be acquired|acquisition of|merger agreement|"
    r"(reports|announces) (first|second|third|fourth|q[1-4]|fiscal|full[- ]year).{0,30}results|revenue (of|increased|grew)|"
    r"awarded .{0,40}\$\s?\d|contract (worth|valued|of) .{0,20}\$\s?\d|\$\s?\d[\d.,]*\s?(million|billion|m|bn)\b|"
    r"purchase order|patent (granted|issued)|uplist\w*)",
    re.I)
PROMO = re.compile(
    r"\b(explor\w+|plans? to|intends? to|aims? to|seeks? to|poised|revolutionary|game[- ]chang\w+|"
    r"disrupt\w*|vision|letter to shareholders|shareholder (letter|update)|ceo (interview|letter)|"
    r"featured|spotlight|sponsored|paid (promotion|advertisement)|investor (presentation|conference)|"
    r"to present at|participate in .{0,30}conference|announces? (launch|rebrand)|memorandum of understanding|mou|"
    r"non-binding|letter of intent|loi|strategic (review|alternatives)|ai[- ]powered|blockchain|crypto treasury)\b",
    re.I)


def classify(item: dict, recent_8k_days: Optional[float] = None) -> str:
    """يرجع: RISK / MATERIAL / PROMO / OTHER"""
    tags = item.get("tags") or I.classify_news(item)
    if set(tags) & I.RISK_TAGS:
        return "RISK"
    text = f"{item.get('headline', '')} {item.get('summary', '')}"
    m, p = bool(MATERIAL.search(text)), bool(PROMO.search(text))
    if m and not p:
        return "MATERIAL"
    if m and p:   # أرقام مع لغة تسويقية: جوهري فقط إذا صاحبه 8-K حديث
        return "MATERIAL" if recent_8k_days is not None and recent_8k_days <= 2 else "PROMO"
    if p:
        return "PROMO"
    if set(tags) & {"FDA", "MNA", "EARNINGS", "CONTRACT"} and recent_8k_days is not None and recent_8k_days <= 2:
        return "MATERIAL"
    return "OTHER"


LABEL = {"RISK": "⚠️ خبر مخاطرة", "MATERIAL": "✅ خبر جوهري", "PROMO": "📣 خبر ترويجي", "OTHER": "📰 خبر عادي"}


def summarize(news: Optional[List[dict]], recent_8k_days: Optional[float]) -> dict:
    if news is None:
        return {"available": False, "best": None, "items": [], "kinds": []}
    items = []
    for n in news[:8]:
        k = classify(n, recent_8k_days)
        items.append({"kind": k, "headline": n.get("headline", ""), "time": n["time_utc"].isoformat() if n.get("time_utc") else "", "source": n.get("source", "")})
    kinds = [x["kind"] for x in items]
    best = "RISK" if "RISK" in kinds else "MATERIAL" if "MATERIAL" in kinds else "PROMO" if "PROMO" in kinds else ("OTHER" if kinds else None)
    return {"available": True, "best": best, "items": items, "kinds": kinds}

# -*- coding: utf-8 -*-
"""الصفقات الافتراضية — لا تُرسل أي أمر حقيقي أبداً.

لكل تنبيه صفقتان افتراضيتان:
  A: دخول عند التنبيه مباشرة (هل التبكير يربح؟)
  B: أمر شراء معلّق فوق مستوى التفعيل — يُنفَّذ فقط إذا اخترق السعر المستوى (هل الانتظار أفضل؟)
وطريقة مقارنة BASE: أي سهم تحت 5$ قفز حجمه في نفس الوقت، بنفس قواعد الخروج.

قواعد الخروج: وقف عند مستوى الإبطال، هدف = target_r × المخاطرة، خروج إجباري 15:55 بتوقيت نيويورك.
المحاكاة على شموع دقيقة للسوق الكامل (SIP) جاءت بعد لحظة الدخول فقط:
  - فجوة تحت الوقف: الخروج بسعر الافتتاح (أسوأ من الوقف) — انزلاق حقيقي.
  - الوقف والهدف في نفس الشمعة: يُحسب الوقف (تحفظ).
  - شمعة التنفيذ في B: إذا لمست الوقف أيضاً نحسبها خسارة (تحفظ).
"""
from datetime import datetime, timedelta
from typing import Dict, List, Optional

import pandas as pd

import intraday as I

EXIT_HHMM = (15, 55)


def _tick_up(p: float) -> float:
    from hu.rules import tick_up
    return tick_up(p)


def exit_time(day: str) -> datetime:
    d = datetime.fromisoformat(day)
    return d.replace(hour=EXIT_HHMM[0], minute=EXIT_HHMM[1], tzinfo=I.ET)


def simulate(t: dict, bars: pd.DataFrame, cut_utc: datetime, slippage_pct: float, target_r: float) -> dict:
    """يعيد حالة الصفقة كاملة من البداية (حتمي). bars: شموع 1m (UTC index)."""
    out = {"status": t["status"] if t["status"] in ("PENDING", "OPEN") else t["status"]}
    created = datetime.fromisoformat(t["created_utc"])
    ex_t = exit_time(t["day"]).astimezone(I.UTC)
    end = min(cut_utc, ex_t)
    if bars is None or bars.empty:
        b = bars
    else:
        b = bars[(bars.index >= pd.Timestamp(created).ceil("min")) & (bars.index < pd.Timestamp(end))]
    kind = t["kind"]
    status = "PENDING" if kind == "B" else "OPEN"
    entry, stop, target = t.get("entry"), t["stop"], t.get("target")
    entry_utc = t.get("entry_utc")
    exit_px = exit_utc = None
    note = ""
    if b is not None and not b.empty:
        for ts, r in b.iterrows():
            o, h, l, c = float(r["open"]), float(r["high"]), float(r["low"]), float(r["close"])
            if status == "PENDING":
                if h >= t["trigger"]:
                    fill = max(o, t["trigger"]) * (1 + slippage_pct / 100)
                    entry, entry_utc = _tick_up(fill), ts.isoformat()
                    risk = entry - stop
                    if risk <= 0:
                        status, note = "CANCELLED", "التنفيذ فوق مستوى لا يترك مسافة للوقف"
                        break
                    target = _tick_up(entry + target_r * risk)
                    status = "OPEN"
                    if l <= stop:     # لا نعرف الترتيب داخل الشمعة: نفترض الأسوأ
                        exit_px, exit_utc, status, note = stop, ts.isoformat(), "STOP", "تنفيذ ثم وقف في نفس الدقيقة (افتراض متحفظ)"
                        break
                    continue
                if l <= stop:
                    status, note, exit_utc = "CANCELLED", "أُبطلت الفكرة قبل الاختراق", ts.isoformat()
                    break
                continue
            # OPEN
            if o <= stop:
                exit_px, exit_utc, status, note = o, ts.isoformat(), "STOP", "فجوة تحت الوقف — خروج بسعر الافتتاح"
                break
            if l <= stop:
                exit_px, exit_utc, status = stop, ts.isoformat(), "STOP"
                if h >= target:
                    note = "الوقف والهدف في نفس الدقيقة — حُسب الوقف"
                break
            if h >= target:
                exit_px, exit_utc, status = max(o, target), ts.isoformat(), "TARGET"
                break
    if status in ("OPEN", "PENDING") and cut_utc >= ex_t:
        if status == "OPEN":
            last = b.iloc[-1] if b is not None and not b.empty else None
            exit_px = float(last["close"]) if last is not None else entry
            exit_utc, status, note = ex_t.isoformat(), "TIME", "خروج بنهاية المدة (15:55 نيويورك)"
        else:
            status, note = "EXPIRED", "لم يخترق المستوى حتى نهاية اليوم"
    out.update(status=status, entry=entry, entry_utc=entry_utc, target=target, note=note,
               exit=exit_px, exit_utc=exit_utc)
    if exit_px is not None and entry:
        sh = int(t["shares"])
        out["pnl"] = round((exit_px - entry) * sh, 2)
        out["r_mult"] = round((exit_px - entry) / (entry - stop), 3) if entry > stop else None
        out["pct"] = round((exit_px / entry - 1) * 100, 3)
    return out


def alert_events(alert: dict, bars: pd.DataFrame, cut_utc: datetime) -> dict:
    """متى تفعّلت الفكرة (اختراق المستوى) أو أُبطلت — من شموع جاءت بعد التنبيه فقط."""
    created = datetime.fromisoformat(alert["alert_utc"])
    end = min(cut_utc, exit_time(alert["day"]).astimezone(I.UTC))
    if bars is None or bars.empty:
        return {}
    b = bars[(bars.index >= pd.Timestamp(created).ceil("min")) & (bars.index < pd.Timestamp(end))]
    for ts, r in b.iterrows():
        hit_t, hit_i = float(r["high"]) >= alert["trigger"], float(r["low"]) <= alert["invalidation"]
        if hit_i:   # في نفس الدقيقة نعتبر الإبطال (تحفظ)
            return {"state": "INVALIDATED", "at": ts.isoformat()}
        if hit_t:
            return {"state": "ACTIVATED", "at": ts.isoformat(),
                    "lead_min": round((ts.to_pydatetime() - created).total_seconds() / 60, 1)}
    if cut_utc >= exit_time(alert["day"]).astimezone(I.UTC):
        return {"state": "EXPIRED", "at": end.isoformat()}
    return {}


def summary(trades: List[dict]) -> dict:
    closed = [t for t in trades if t.get("pnl") is not None]
    n = len(closed)
    if not n:
        return {"trades": 0, "open": sum(1 for t in trades if t["status"] in ("OPEN", "PENDING"))}
    wins = [t for t in closed if t["pnl"] > 0]
    losses = [t for t in closed if t["pnl"] <= 0]
    eq, peak, dd = 0.0, 0.0, 0.0
    for t in sorted(closed, key=lambda x: x.get("exit_utc") or ""):
        eq += t["pnl"]; peak = max(peak, eq); dd = min(dd, eq - peak)
    rs = [t["r_mult"] for t in closed if t.get("r_mult") is not None]
    return {
        "trades": n,
        "open": sum(1 for t in trades if t["status"] in ("OPEN", "PENDING")),
        "not_filled": sum(1 for t in trades if t["status"] in ("EXPIRED", "CANCELLED")),
        "win_rate": round(len(wins) / n, 3),
        "avg_win": round(sum(t["pnl"] for t in wins) / len(wins), 2) if wins else 0.0,
        "avg_loss": round(sum(t["pnl"] for t in losses) / len(losses), 2) if losses else 0.0,
        "avg_pct": round(sum(t["pct"] for t in closed) / n, 2),
        "avg_r": round(sum(rs) / len(rs), 3) if rs else None,
        "total_pnl": round(sum(t["pnl"] for t in closed), 2),
        "max_drawdown": round(dd, 2),
    }

# -*- coding: utf-8 -*-
"""قاعدة SQLite محلية (data/headsup.db) — تُحفظ في المستودع بعد كل تشغيل لتراجعها لاحقاً."""
import json
import os
import sqlite3
from typing import Optional

SCHEMA = """
CREATE TABLE IF NOT EXISTS runs (
  id INTEGER PRIMARY KEY AUTOINCREMENT, kind TEXT, started_utc TEXT, scheduled_utc TEXT, delay_min REAL,
  market_open INTEGER, universe INTEGER, swept INTEGER, shortlist INTEGER, qualified INTEGER, alerts INTEGER,
  api_calls INTEGER, sec_calls INTEGER, duration_sec REAL, feed_note TEXT, errors TEXT);
CREATE TABLE IF NOT EXISTS candidates (
  run_id INTEGER, day TEXT, symbol TEXT, score INTEGER, stage TEXT, qualifies INTEGER, data TEXT);
CREATE INDEX IF NOT EXISTS ix_cand_day ON candidates(day, symbol);
CREATE TABLE IF NOT EXISTS alerts (
  id INTEGER PRIMARY KEY AUTOINCREMENT, day TEXT, symbol TEXT, run_id INTEGER, alert_utc TEXT, kind TEXT,
  score INTEGER, price REAL, trigger REAL, invalidation REAL, data_quality INTEGER, gain_from_open REAL,
  state TEXT DEFAULT 'OPEN', activated_utc TEXT, invalidated_utc TEXT, lead_min REAL, sent INTEGER, message TEXT, data TEXT);
CREATE INDEX IF NOT EXISTS ix_alert_day ON alerts(day, symbol);
CREATE TABLE IF NOT EXISTS trades (
  id INTEGER PRIMARY KEY AUTOINCREMENT, alert_id INTEGER, kind TEXT, day TEXT, symbol TEXT, created_utc TEXT,
  ref_price REAL, trigger REAL, entry_utc TEXT, entry REAL, stop REAL, target REAL, shares INTEGER,
  status TEXT, exit_utc TEXT, exit REAL, pnl REAL, r_mult REAL, pct REAL, note TEXT);
CREATE INDEX IF NOT EXISTS ix_trade_day ON trades(day, status);
CREATE TABLE IF NOT EXISTS missed (
  day TEXT, symbol TEXT, prev_close REAL, high REAL, max_gain_pct REAL, close_gain_pct REAL,
  was_candidate INTEGER, best_score INTEGER, reason TEXT, PRIMARY KEY(day, symbol));
CREATE TABLE IF NOT EXISTS movers (
  day TEXT, symbol TEXT, first_utc TEXT, first_chg REAL, first_price REAL, PRIMARY KEY(day, symbol));
CREATE TABLE IF NOT EXISTS sent (key TEXT PRIMARY KEY, day TEXT, at_utc TEXT);
"""


class Store:
    def __init__(self, path: str):
        os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
        self.path = path
        self.db = sqlite3.connect(path)
        self.db.row_factory = sqlite3.Row
        self.db.executescript(SCHEMA)

    def q(self, sql: str, args=()) -> list:
        return [dict(r) for r in self.db.execute(sql, args).fetchall()]

    def one(self, sql: str, args=()) -> Optional[dict]:
        r = self.db.execute(sql, args).fetchone()
        return dict(r) if r else None

    def insert(self, table: str, row: dict) -> int:
        row = {k: (json.dumps(v, ensure_ascii=False, default=str) if isinstance(v, (dict, list)) else v) for k, v in row.items()}
        cols = ",".join(row)
        cur = self.db.execute(f"INSERT INTO {table} ({cols}) VALUES ({','.join('?' * len(row))})", list(row.values()))
        return cur.lastrowid

    def update(self, table: str, rid: int, **kw) -> None:
        if not kw:
            return
        sets = ",".join(f"{k}=?" for k in kw)
        self.db.execute(f"UPDATE {table} SET {sets} WHERE id=?", list(kw.values()) + [rid])

    def once(self, key: str, day: str, at: str) -> bool:
        """True أول مرة فقط لهذا المفتاح (منع تكرار الرسائل)."""
        try:
            self.db.execute("INSERT INTO sent (key, day, at_utc) VALUES (?,?,?)", (key, day, at))
            return True
        except sqlite3.IntegrityError:
            return False

    def commit(self):
        self.db.commit()

    def close(self):
        self.db.commit()
        self.db.close()
