name: headsup

# مشغّل مستمر: كل تشغيل يبقى يعمل حتى 5 ساعات و40 دقيقة ويفحص في المواعيد بنفسه
# (قبل الافتتاح كل 15 دقيقة • الجلسة كل 5 دقائق • بعد الإغلاق كل 15 دقيقة • إغلاق اليوم بعد الإغلاق بـ20 دقيقة).
# السبب: GitHub يُسقط كثيراً من التشغيلات المجدولة المتقاربة. هنا عدة مواعيد بداية تتسلّم من بعضها؛
# إذا كان تشغيل يعمل، ينتظر التالي دوره (concurrency) ثم يكمل من حيث يكون الوقت.
on:
  schedule:
    - cron: "5 11 * * 1-5"
    - cron: "5 12 * * 1-5"
    - cron: "35 16 * * 1-5"
    - cron: "35 17 * * 1-5"
    - cron: "5 22 * * 1-5"
    - cron: "5 23 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "loop = المشغّل المستمر • once = فحص واحد • pre / post / final"
        type: choice
        options: [loop, once, pre, post, final]
        default: loop

permissions:
  contents: write     # حفظ قاعدة البيانات في فرع data
  actions: write      # طلب نشر الموقع (site.yml)

concurrency:
  group: headsup
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: |
          MODE="${{ inputs.mode }}"
          case "${MODE:-loop}" in
            loop)  python loop.py ;;
            once)  python run.py ;;
            pre)   python run.py --pre ;;
            post)  python run.py --post ;;
            final) python run.py --final ;;
          esac
