name: research

# دراسة تاريخية (2016 → الآن): ما الذي سبق ارتفاع الأسهم تحت 5$؟ تُشغَّل يدوياً.
# النتائج تُحفظ في فرع research (results.json + صفوف الدراسة داخل اليوم).
on:
  workflow_dispatch:
    inputs:
      events:
        description: "عدد أيام العينة داخل اليوم"
        default: "6000"

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt scikit-learn
      - name: Research
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          RESEARCH_EVENTS: ${{ inputs.events }}
          RESEARCH_OUT: research_out
          PYTHONUNBUFFERED: "1"
        run: python research.py
      - name: Save results
        if: always()
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, ".")
          from hu import gitdata
          import os
          files = {n: os.path.join("research_out", n) for n in ("results.json", "intraday_rows.csv.gz")}
          print(gitdata.publish(".", files, "research results", branch="research"))
          EOF
